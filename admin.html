<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Админ-панель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: #000; color: white; margin: 0; padding: 20px;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        h2 { font-weight: 800; font-size: 24px; margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; margin-left: 5px; }
        input, select {
            width: 100%; padding: 15px; background: #1c1c1e; border: 1px solid #333;
            border-radius: 12px; color: white; font-size: 15px; font-family: inherit; box-sizing: border-box;
        }
        input:focus, select:focus { outline: none; border-color: #fff; }
        .row { display: flex; gap: 10px; }
        .row > * { flex: 1; }
        button {
            width: 100%; padding: 16px; background: white; color: black;
            border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
            margin-top: 20px; cursor: pointer;
        }
        button:active { background: #ccc; }
        .success { color: #34c759; text-align: center; margin-top: 15px; font-weight: 600; display: none; }
        
        /* Стили для списка товаров */
        .divider { height: 1px; background: #333; margin: 30px 0 20px; }
        h3 { font-size: 18px; font-weight: 700; margin-bottom: 15px; text-align: center; }
        .product-list { display: flex; flex-direction: column; gap: 10px; }
        .admin-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #1c1c1e; padding: 12px 15px; border-radius: 12px; border: 1px solid #333;
        }
        .admin-item-info { flex: 1; overflow: hidden; }
        .admin-item-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .admin-item-price { font-size: 12px; color: #888; margin-top: 4px; }
        .delete-btn {
            background: #ff3b30; color: white; border: none; padding: 8px 12px;
            border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
            width: auto; margin: 0; margin-left: 10px; flex-shrink: 0;
        }
        .delete-btn:active { background: #cc2f26; }
        .loading-text { text-align: center; color: #888; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>🔐 Админ-панель</h2>
    
    <div class="form-group">
        <label>Название</label>
        <input type="text" id="name" placeholder="Кроссовки Nike Air">
    </div>
    
    <div class="row">
        <div class="form-group">
            <label>Цена</label>
            <input type="number" id="price" placeholder="0">
        </div>
        <div class="form-group">
            <label>Валюта</label>
            <select id="currency">
                <option value="KZT">Тенге (₸)</option>
                <option value="RUB">Рубли (₽)</option>
                <option value="UAH">Гривны (₴)</option>
                <option value="BYN">Бел. рубли (Br)</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Количество (шт)</label>
            <input type="number" id="stock" placeholder="0">
        </div>
        <div class="form-group">
            <label>Пол</label>
            <select id="gender">
                <option value="Унисекс">Унисекс</option>
                <option value="Мужской">Мужской</option>
                <option value="Женский">Женский</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>Размеры (через запятую)</label>
        <input type="text" id="sizes" placeholder="S, M, L или 40, 41, 42">
    </div>

    <div class="form-group">
        <label>Ссылка на фото</label>
        <input type="text" id="photo" placeholder="https://...">
    </div>

    <div class="form-group">
        <label>Категория</label>
        <select id="category">
            <option value="outerwear">Верхняя одежда</option>
            <option value="tshirts">Футболки и верх</option>
            <option value="pants">Штаны</option>
            <option value="shoes">Обувь</option>
            <option value="accessories">Аксессуары</option>
        </select>
    </div>
    
    <button onclick="addProduct()">Добавить товар</button>
    <div id="msg" class="success">✅ Товар добавлен!</div>

    <div class="divider"></div>

    <h3>🗑 Управление товарами</h3>
    <div id="product-list" class="product-list">
        <div class="loading-text">Загрузка товаров...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        const BIN_ID = "6b03f367ac6210605a9d6544";
        const MASTER_KEY = "$2a$10$N4Bo3Ce.syteyZ3fcwyhMOLONFcaF6IszommguuY.EIpLqr4WUt3O";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // Загрузка всех товаров для списка удаления
        async function loadProducts() {
            const listContainer = document.getElementById('product-list');
            try {
                const res = await fetch(`${API_URL}/latest`, { headers: { 'X-Master-Key': MASTER_KEY } });
                const data = await res.json();
                let db = data.record;
                
                if (!db || Object.keys(db).length === 0) {
                    listContainer.innerHTML = '<div class="loading-text">Товаров пока нет.</div>';
                    return;
                }

                listContainer.innerHTML = '';
                let hasProducts = false;

                const catNames = { outerwear: "Верхняя одежда", tshirts: "Футболки", pants: "Штаны", shoes: "Обувь", accessories: "Аксессуары" };

                // Проходимся по всем категориям
                for (let cat in db) {
                    if (!Array.isArray(db[cat])) continue;
                    
                    db[cat].forEach((product, index) => {
                        hasProducts = true;
                        
                        // Значок валюты
                        const currencySymbols = { 'KZT': '₸', 'RUB': '₽', 'UAH': '₴', 'BYN': 'Br' };
                        const symbol = currencySymbols[product.currency] || '₸';

                        const item = document.createElement('div');
                        item.className = 'admin-item';
                        item.innerHTML = `
                            <div class="admin-item-info">
                                <div class="admin-item-title">${product.name}</div>
                                <div class="admin-item-price">${product.price} ${symbol} • ${catNames[cat] || cat}</div>
                            </div>
                            <button class="delete-btn" onclick="deleteProduct('${cat}', '${product.id}')">Удалить</button>
                        `;
                        listContainer.appendChild(item);
                    });
                }

                if (!hasProducts) {
                    listContainer.innerHTML = '<div class="loading-text">Товаров пока нет.</div>';
                }
            } catch (e) {
                listContainer.innerHTML = '<div class="loading-text" style="color:#ff3b30;">Ошибка загрузки списка</div>';
            }
        }

        // Добавление товара
        async function addProduct() {
            const name = document.getElementById('name').value;
            const price = parseInt(document.getElementById('price').value);
            const stock = parseInt(document.getElementById('stock').value);
            const currency = document.getElementById('currency').value;
            const sizesStr = document.getElementById('sizes').value;
            let photo = document.getElementById('photo').value.trim();
            const gender = document.getElementById('gender').value;
            const category = document.getElementById('category').value;

            if (!name || isNaN(price) || isNaN(stock)) { alert("Заполните поля!"); return; }

            if (!photo) photo = "https://via.placeholder.com/400x500?text=No+Image";

            let sizes = sizesStr ? sizesStr.split(',').map(s => s.trim()).filter(s => s) : [];

            const newProduct = {
                id: Date.now().toString(),
                name, price, stock, sizes, gender, photo,
                currency // Сохраняем валюту
            };

            try {
                const res = await fetch(`${API_URL}/latest`, { headers: { 'X-Master-Key': MASTER_KEY } });
                const data = await res.json();
                let db = data.record;
                if (Object.keys(db).length === 0) db = { outerwear: [], tshirts: [], pants: [], shoes: [], accessories: [] };
                
                if (!db[category]) db[category] = [];
                db[category].push(newProduct);

                await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                    body: JSON.stringify(db)
                });

                document.getElementById('msg').style.display = 'block';
                setTimeout(() => document.getElementById('msg').style.display = 'none', 2000);
                
                // Очистка
                document.getElementById('name').value = '';
                document.getElementById('price').value = '';
                document.getElementById('stock').value = '';
                document.getElementById('photo').value = '';

                if (tg) tg.HapticFeedback.notificationOccurred('success');
                
                // Обновляем список товаров внизу
                loadProducts();
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }

        // Удаление товара
        async function deleteProduct(category, id) {
            if (!confirm("Вы уверены, что хотите удалить этот товар?")) return;

            try {
                const res = await fetch(`${API_URL}/latest`, { headers: { 'X-Master-Key': MASTER_KEY } });
                const data = await res.json();
                let db = data.record;

                // Фильтруем массив, оставляя только товары с другим ID
                if (db[category]) {
                    db[category] = db[category].filter(p => p.id !== id);
                }

                await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                    body: JSON.stringify(db)
                });

                if (tg) tg.HapticFeedback.notificationOccurred('success');
                loadProducts(); // Перерисовываем список
            } catch (e) {
                alert("Ошибка при удалении: " + e.message);
            }
        }

        // Запускаем загрузку списка при открытии страницы
        loadProducts();
    </script>
</body>
</html>
