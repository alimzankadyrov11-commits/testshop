<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Админ-панель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; padding: 20px; color: #1d1d1f; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h2 { text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #007aff; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; margin-top: 15px; cursor: pointer; }
        button:active { opacity: 0.7; }
        .success { color: green; text-align: center; margin-top: 10px; font-weight: 600; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Админ-панель</h2>
        <input type="text" id="name" placeholder="Название (например, Кроссовки)">
        <input type="number" id="price" placeholder="Цена (в рублях)">
        <input type="text" id="photo" placeholder="Ссылка на фото (https://...)">
        
        <select id="category">
            <option value="outerwear">Верхняя одежда</option>
            <option value="tshirts">Футболки и верх</option>
            <option value="pants">Штаны</option>
            <option value="shoes">Обувь</option>
            <option value="accessories">Аксессуары</option>
        </select>
        
        <button onclick="addProduct()">Добавить товар</button>
        <div id="msg" class="success">✅ Товар добавлен в магазин!</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        const BIN_ID = "6b03f367ac6210605a9d6544";
        const MASTER_KEY = "$2a$10$N4Bo3Ce.syteyZ3fcwyhMOLONFcaF6IszommguuY.EIpLqr4WUt3O";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        async function addProduct() {
            const name = document.getElementById('name').value;
            const price = document.getElementById('price').value;
            const photo = document.getElementById('photo').value;
            const category = document.getElementById('category').value;

            if (!name || !price || !photo) {
                alert("Заполните все поля!");
                return;
            }

            const newProduct = {
                id: Date.now().toString(),
                name: name,
                price: parseInt(price),
                photo: photo
            };

            try {
                // 1. Получаем текущую базу
                const res = await fetch(`${API_URL}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                let db = data.record;

                // Если база пустая, создаем структуру
                if (Object.keys(db).length === 0) {
                    db = { outerwear: [], tshirts: [], pants: [], shoes: [], accessories: [] };
                }

                // 2. Добавляем товар
                if (!db[category]) db[category] = [];
                db[category].push(newProduct);

                // 3. Сохраняем обратно
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(db)
                });

                document.getElementById('msg').style.display = 'block';
                setTimeout(() => { document.getElementById('msg').style.display = 'none'; }, 3000);
                
                // Очищаем поля
                document.getElementById('name').value = '';
                document.getElementById('price').value = '';
                document.getElementById('photo').value = '';

                if (tg) tg.HapticFeedback.notificationOccurred('success');

            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }
    </script>
</body>
</html>
