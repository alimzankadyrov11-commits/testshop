<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BLVCK® Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --border-color: #2c2c2e;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-primary); padding-bottom: calc(90px + var(--safe-bottom)); overflow-x: hidden; }
        ::-webkit-scrollbar { display: none; }
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ШАПКА */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); position: sticky; top: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: -1px; }
        .icon-btn { background: none; border: none; color: white; cursor: pointer; padding: 5px; position: relative; }
        .badge { position: absolute; top: -2px; right: -5px; background: #ff3b30; color: white; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 10px; }

        /* ГЛАВНАЯ */
        .hero { position: relative; height: 400px; margin: 0 20px; border-radius: 24px; overflow: hidden; display: flex; align-items: flex-end; padding: 24px; }
        .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .hero-content { position: relative; z-index: 1; }
        .hero h1 { font-size: 40px; font-weight: 800; line-height: 1.1; margin: 0 0 10px 0; text-transform: uppercase; }
        .hero p { color: #ccc; margin: 0 0 20px 0; font-size: 14px; }
        .hero-btn { background: white; color: black; border: none; padding: 14px 24px; border-radius: 30px; font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .section-title { font-size: 20px; font-weight: 700; margin: 30px 20px 15px; }

        /* СЕТКА ТОВАРОВ */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 20px; }
        .product-card { position: relative; background: var(--surface-color); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; cursor: pointer; }
        .product-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; background: #2c2c2e; }
        .product-card h3 { font-size: 14px; font-weight: 600; margin: 10px 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-card .price { font-size: 15px; font-weight: 700; color: var(--text-secondary); }
        .heart-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); border: none; border-radius: 50%; padding: 8px; color: white; cursor: pointer; backdrop-filter: blur(5px); }
        .heart-btn.active { color: #ff3b30; }

        /* КАТЕГОРИИ */
        .chips-container { display: flex; gap: 10px; overflow-x: auto; padding: 0 20px; margin-bottom: 20px; }
        .chip { background: var(--surface-color); color: white; border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 20px; white-space: nowrap; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .chip.active { background: white; color: black; border-color: white; }

        /* НИЖНЯЯ НАВИГАЦИЯ */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(65px + var(--safe-bottom)); background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); font-size: 10px; font-weight: 500; gap: 4px; cursor: pointer; }
        .nav-item.active { color: var(--text-primary); }
        .nav-item i { width: 22px; height: 22px; }

        /* КОРЗИНА */
        .cart-list { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .cart-item { display: flex; gap: 15px; align-items: center; background: var(--surface-color); padding: 12px; border-radius: 16px; }
        .cart-item img { width: 70px; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer; }
        .cart-info { flex: 1; }
        .cart-info h4 { margin: 0 0 5px 0; font-size: 15px; font-weight: 600; }
        .cart-info .size-text { font-size: 12px; color: #8e8e93; margin-bottom: 4px; }
        .cart-info .price { color: var(--text-secondary); font-size: 14px; font-weight: 600; }
        .qty-controls { display: flex; align-items: center; gap: 10px; margin-top: 8px; background: #000; border-radius: 8px; padding: 4px 8px; width: fit-content; }
        .qty-btn { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 0 5px; }
        .qty-val { font-size: 13px; font-weight: 600; min-width: 15px; text-align: center; }

        /* ОФОРМЛЕНИЕ */
        .checkout-form { padding: 20px; background: var(--surface-color); margin: 20px; border-radius: 20px; }
        .checkout-form h3 { margin-top: 0; font-size: 18px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
        .input-group input, .input-group select { width: 100%; padding: 15px; background: #000; border: 1px solid var(--border-color); border-radius: 12px; color: white; font-size: 15px; font-family: inherit; }
        .input-group input:focus, .input-group select:focus { outline: none; border-color: #555; }
        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-secondary); }
        .empty-state i { width: 48px; height: 48px; margin-bottom: 15px; opacity: 0.5; }

        /* МОДАЛКА РАЗМЕРОВ */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 3000; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--surface-color); padding: 24px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; }
        .modal-content h3 { margin: 0 0 20px 0; font-size: 20px; }
        .size-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .size-btn { background: #000; color: white; border: 1px solid var(--border-color); padding: 12px 20px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .size-btn:hover { border-color: #555; }
        .size-btn.selected { background: white; color: black; border-color: white; }
        .modal-btn { background: white; color: black; border: none; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 10px; }
        .modal-btn:active { background: #ccc; }
        .modal-btn:disabled { background: #555; color: #888; cursor: not-allowed; }
        
        /* ПРОФИЛЬ */
        .profile-menu { text-align: left; background: var(--surface-color); border-radius: 16px; overflow: hidden; margin-bottom: 20px; }
        .profile-menu-item { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: white; text-decoration: none; }
        .profile-menu-item:last-child { border-bottom: none; }

        /* ПРОМОКОДЫ */
        .promo-box { display: flex; gap: 10px; margin-top: 15px; }
        .promo-box input { flex: 1; margin-bottom: 0; }
        .promo-box button { width: auto; margin: 0; padding: 15px 20px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- ГЛАВНАЯ -->
    <div id="page-home" class="page active">
        <div class="top-bar">
            <div class="logo">BLVCK®</div>
            <button class="icon-btn" onclick="openCart()"><i data-feather="shopping-bag"></i><span class="badge" id="cart-badge" style="display:none;">0</span></button>
        </div>
        <div class="hero">
            <img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?q=80&w=800&auto=format&fit=crop" alt="Hero">
            <div class="hero-content">
                <h1>LESS NOISE.<br>MORE STYLE.</h1>
                <p>Own your vibe. BLVCK®</p>
                <button class="hero-btn" onclick="switchTab('catalog')">Перейти в каталог <i data-feather="arrow-right" style="width:16px;"></i></button>
            </div>
        </div>
        <h2 class="section-title">Популярное</h2>
        <div class="product-grid" id="popular-grid"></div>

    <!-- КАТАЛОГ -->
    <div id="page-catalog" class="page">
        <div class="top-bar">
            <div class="logo">Каталог</div>
            <button class="icon-btn" onclick="openCart()"><i data-feather="shopping-bag"></i><span class="badge" id="cart-badge-cat" style="display:none;">0</span></button>
        </div>
        <div class="chips-container" id="category-chips"></div>
        <div class="product-grid" id="catalog-grid"></div>

    <!-- ИЗБРАННОЕ -->
    <div id="page-favorites" class="page">
        <div class="top-bar">

            <button class="icon-btn" onclick="openCart()"><i data-feather="shopping-bag"></i></button>
        </div>
        <div class="product-grid" id="favorites-grid"></div>

    <!-- ПРОФИЛЬ -->
    <div id="page-profile" class="page">

            <div class="logo">Профиль</div>
            <button class="icon-btn" onclick="openCart()"><i data-feather="shopping-bag"></i></button>
        </div>
        <div style="padding: 20px; text-align: center;">
            <div style="width: 80px; height: 80px; background: #333; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 30px;">👤</div>
            <h2 style="margin: 0 0 5px;">Покупатель</h2>
            <p style="color: var(--text-secondary); margin: 0 0 30px;">@telegram_user</p>
            
            <div class="profile-menu">
                <div class="profile-menu-item" onclick="showMyOrders()">
                    <span>Мои заказы</span> <i data-feather="chevron-right" style="color: #666;"></i>
                </div>
                <a href="https://t.me/RiskAndReach" target="_blank" style="text-decoration: none;">
                    <div class="profile-menu-item" style="border-bottom: none;">
                        <span>Поддержка</span> <i data-feather="chevron-right" style="color: #666;"></i>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <!-- МОИ ЗАКАЗЫ -->
    <div id="page-my-orders" class="page" style="background: #000; position: fixed; inset: 0; z-index: 2500; overflow-y: auto;">
        <div class="top-bar">
            <button class="icon-btn" onclick="switchTab('profile')"><i data-feather="arrow-left"></i></button>
            <div class="logo">Мои заказы</div>
            <div style="width: 24px;"></div>
        </div>
        <div id="orders-list" style="padding: 20px;"></div>
    </div>

    <!-- КОРЗИНА -->
    <div id="page-cart" class="page" style="background: #000; position: fixed; inset: 0; z-index: 2000; overflow-y: auto;">
        <div class="top-bar">
            <button class="icon-btn" onclick="switchTab('home')"><i data-feather="arrow-left"></i></button>
            <div class="logo">Корзина</div>
            <div style="width: 24px;"></div>
        </div>
        <div id="cart-items-container" class="cart-list"></div>
        <div id="cart-checkout-area" style="display: none;">
            <div class="checkout-form">
                <h3>Оформление заказа</h3>
                <div class="input-group">
                    <label>Промокод</label>
                    <div class="promo-box">
                        <input type="text" id="promo-input" placeholder="Введите код" style="background: #1c1c1e;">
                        <button class="hero-btn" onclick="applyPromo()">Применить</button>
                    </div>
                    <div id="promo-status" style="font-size: 12px; margin-top: 5px;"></div>
                </div>
                <div class="input-group">
                    <label>Валюта</label>
                    <select id="order-currency">
                        <option value="RUB">Российский рубль (₽)</option>

                    <input type="text" id="order-address" placeholder="ул. Абая, 123">

                    <input type="tel" id="order-phone" placeholder="+7 777 123 45 67">

    <!-- МОДАЛЬНОЕ ОКНО ВЫБОРА РАЗМЕРА -->
    <div id="size-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title">Выберите размер</h3>
            <div class="size-grid" id="modal-sizes"></div>
            <button class="modal-btn" id="modal-confirm-btn" onclick="confirmSize()" disabled>Подтвердить</button>
            <button class="modal-btn" style="background: transparent; color: #ff3b30; border: 1px solid #ff3b30; margin-top: 10px;" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)"><i data-feather="home"></i><span>Главная</span></div>
        <div class="nav-item" onclick="switchTab('catalog', this)"><i data-feather="grid"></i><span>Каталог</span></div>
        <div class="nav-item" onclick="switchTab('favorites', this)"><i data-feather="heart"></i><span>Избранное</span></div>
        <div class="nav-item" onclick="switchTab('profile', this)"><i data-feather="user"></i><span>Профиль</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
            if (tg.MainButton) tg.MainButton.hide();
        }

        const BIN_ID = "6b03f367ac6210605a9d6544";
        const MASTER_KEY = "$2a$10$N4Bo3Ce.syteyZ3fcwyhMOLONFcaF6IszommguuY.EIpLqr4WUt3O";
        
        let catalog = {};
        let promos = [];
        let cart = [];
        let favorites = JSON.parse(localStorage.getItem('blvck_favs')) || [];
        let currentCategory = "Все";
        let appliedPromo = null; 
        const CURRENCY_SYMBOLS = { 'KZT': '₸', 'RUB': '₽', 'UAH': '₴', 'BYN': 'Br' };
        let currentEditItem = null;
        let selectedSize = null;

        async function loadData() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': MASTER_KEY } });
                const data = await res.json();
                catalog = data.record;
                promos = catalog.promocodes || [];
                renderHome();
                renderCatalog();
                renderFavorites();
                feather.replace();
            } catch (e) { console.error("Ошибка загрузки", e); }
        }

        function renderHome() {
            const grid = document.getElementById('popular-grid');
            grid.innerHTML = '';
            let allProducts = [];
            for (let cat in catalog) {
                if (Array.isArray(catalog[cat]) && cat !== 'promocodes') allProducts = allProducts.concat(catalog[cat].map(p => ({...p, catId: cat})));
            }
            allProducts.slice(0, 4).forEach(p => {
                if (p.stock > 0) grid.innerHTML += createProductCard(p);
            });
        }

        function renderCatalog() {
            const chips = document.getElementById('category-chips');
            chips.innerHTML = `<div class="chip active" onclick="filterCatalog('Все', this)">Все</div>`;
            const catNames = { outerwear: "Верхняя одежда", tshirts: "Футболки", pants: "Штаны", shoes: "Обувь", accessories: "Аксессуары" };
            for (let cat in catalog) {
                if (Array.isArray(catalog[cat]) && cat !== 'promocodes' && catalog[cat].length > 0) {
                    chips.innerHTML += `<div class="chip" onclick="filterCatalog('${cat}', this)">${catNames[cat] || cat}</div>`;
                }
            }
            filterCatalog('Все');
        }

        function filterCatalog(catId, element) {
            if (element) {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                element.classList.add('active');
            }
            currentCategory = catId;
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';
            let itemsToRender = [];
            if (catId === 'Все') {
                for (let c in catalog) {
                    if (Array.isArray(catalog[c]) && c !== 'promocodes') itemsToRender = itemsToRender.concat(catalog[c].map(p => ({...p, catId: c})));
                }
            } else {
                if (catalog[catId]) itemsToRender = catalog[catId].map(p => ({...p, catId}));
            }
            itemsToRender.forEach(p => {
                if (p.stock > 0) grid.innerHTML += createProductCard(p);
            });
        }

        function createProductCard(p) {
            const isFav = favorites.includes(p.id);
            const imgSrc = p.photo || 'https://via.placeholder.com/400x500?text=No+Image';
            const symbol = CURRENCY_SYMBOLS[p.currency] || '₸'; 
            let priceHtml = `${(p.price || 0).toLocaleString()} ${symbol}`;
            if (appliedPromo) {
                const newPrice = Math.round(p.price * (1 - appliedPromo.discount / 100));
                priceHtml = `<span style="text-decoration: line-through; font-size: 12px; color: #888;">${p.price} ${symbol}</span> <span style="color: #34c759;">${newPrice.toLocaleString()} ${symbol}</span>`;
            }
            return `
                <div class="product-card" onclick="openProduct('${p.id}', '${p.catId}')">
                    <button class="heart-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${p.id}')"><i data-feather="heart" style="width: 18px; height: 18px;"></i></button>
                    <img src="${imgSrc}" alt="${p.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x500?text=No+Image'">
                    <h3>${p.name}</h3>
                    <div class="price">${priceHtml}</div>
                </div>
            `;
        }

        function toggleFav(e, id) {
            e.stopPropagation();
            if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
            else favorites.push(id);
            localStorage.setItem('blvck_favs', JSON.stringify(favorites));
            if (tg) tg.HapticFeedback.impactOccurred('light');
            renderHome(); renderCatalog(); renderFavorites(); feather.replace();
        }

        function renderFavorites() {
            const grid = document.getElementById('favorites-grid');
            grid.innerHTML = '';
            let allProducts = [];
            for (let cat in catalog) {
                if (Array.isArray(catalog[cat]) && cat !== 'promocodes') allProducts = allProducts.concat(catalog[cat].map(p => ({...p, catId: cat})));
            }
            const favItems = allProducts.filter(p => favorites.includes(p.id));
            if (favItems.length === 0) grid.innerHTML = `<div class="empty-state" style="grid-column: span 2;"><i data-feather="heart"></i><br>Нет избранных товаров</div>`;
            else favItems.forEach(p => grid.innerHTML += createProductCard(p));
            feather.replace();
        }

        function openProduct(id, catId) {
            const product = catalog[catId].find(p => p.id === id);
            if (!product) return;
            addToCart(product, catId);
        }

        function openCart() {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-cart').classList.add('active');
            renderCart();
            feather.replace();
        }

        function addToCart(product, catId) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                if (existing.qty < product.stock) {
                    existing.qty += 1;
                    if (!existing.size && product.sizes && product.sizes.length > 0) openSizeModal(product.id, catId);
                } else { tg.showAlert("Больше нет в наличии!"); return; }
            } else {
                cart.push({ ...product, qty: 1, catId, size: "" });
                if (product.sizes && product.sizes.length > 0) openSizeModal(product.id, catId);
            }
            updateCartBadge();
            if (tg) tg.HapticFeedback.notificationOccurred('success');
        }

        function openSizeModal(productId, catId) {
            let product = null;
            if (catalog[catId]) product = catalog[catId].find(p => p.id === productId);
            if (!product) return;

            currentEditItem = { id: productId, catId: catId };
            selectedSize = null;
            const cartItem = cart.find(i => i.id === productId);
            const sizesContainer = document.getElementById('modal-sizes');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            document.getElementById('modal-title').innerText = `Размер: ${product.name}`;
            sizesContainer.innerHTML = '';
            confirmBtn.disabled = true;

            if (!product.sizes || product.sizes.length === 0) {
                sizesContainer.innerHTML = `<div style="color: #888; margin-bottom: 15px;">Для этого товара размер не требуется</div>`;
                confirmBtn.disabled = false;
            } else {
                product.sizes.forEach(s => {
                    const btn = document.createElement('div');
                    btn.className = 'size-btn';
                    btn.innerText = s;
                    if (cartItem && cartItem.size === s) {
                        btn.classList.add('selected');
                        selectedSize = s;
                        confirmBtn.disabled = false;
                    }
                    btn.onclick = () => {
                        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedSize = s;
                        confirmBtn.disabled = false;
                    };
                    sizesContainer.appendChild(btn);
                });
            }
            document.getElementById('size-modal').classList.add('active');
        }

        function confirmSize() {
            if (!currentEditItem) return;
            const cartItem = cart.find(i => i.id === currentEditItem.id);
            if (cartItem) cartItem.size = selectedSize || "";
            closeModal();
            renderCart();
            feather.replace();
        }

        function closeModal() {
            document.getElementById('size-modal').classList.remove('active');
            currentEditItem = null;
            selectedSize = null;
        }

        function updateCartBadge() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.querySelectorAll('.badge').forEach(el => {
                el.innerText = count;
                el.style.display = count > 0 ? 'block' : 'none';
            });
        }

        function applyPromo() {
            const code = document.getElementById('promo-input').value.trim().toUpperCase();
            const statusEl = document.getElementById('promo-status');
            if (!code) { statusEl.innerHTML = '<span style="color: #ff3b30;">Введите код</span>'; return; }
            const promo = promos.find(p => p.code === code);
            if (!promo) { statusEl.innerHTML = '<span style="color: #ff3b30;">Промокод не найден</span>'; return; }
            if (promo.uses <= 0) { statusEl.innerHTML = '<span style="color: #ff3b30;">Срок действия промокода истек</span>'; return; }
            appliedPromo = promo;
            statusEl.innerHTML = `<span style="color: #34c759;">Промокод ${promo.code} применен (Скидка: ${promo.discount}%)</span>`;
            renderCart();
            feather.replace();
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const checkoutArea = document.getElementById('cart-checkout-area');
            container.innerHTML = '';
            if (cart.length === 0) {
                container.innerHTML = `<div class="empty-state"><i data-feather="shopping-bag"></i><br>Корзина пуста</div>`;
                checkoutArea.style.display = 'none';
                return;
            }
            checkoutArea.style.display = 'block';
            cart.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'cart-item';
                const symbol = CURRENCY_SYMBOLS[item.currency] || '₸';
                let sizeText = '';
                if (item.size) sizeText = `<div class="size-text">Размер: ${item.size}</div>`;
                else if (item.sizes && item.sizes.length > 0) sizeText = `<div class="size-text" style="color: #ff3b30; cursor: pointer;" onclick="openSizeModal('${item.id}', '${item.catId}')">! Выбрать размер</div>`;
                let priceHtml = `${item.price.toLocaleString()} ${symbol}`;
                if (appliedPromo) {
                    const newPrice = Math.round(item.price * (1 - appliedPromo.discount / 100));
                    priceHtml = `<span style="text-decoration: line-through; font-size: 12px; color: #888;">${item.price} ${symbol}</span> <span style="color: #34c759;">${newPrice.toLocaleString()} ${symbol}</span>`;
                }
                div.innerHTML = `
                    <img src="${item.photo || 'https://via.placeholder.com/400x500?text=No+Image'}" alt="${item.name}" onclick="openSizeModal('${item.id}', '${item.catId}')">
                    <div class="cart-info">
                        <h4>${item.name}</h4>
                        ${sizeText}
                        <div class="price">${priceHtml}</div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
                            <span class="qty-val">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                        </div>
                    </div>
                    <button class="icon-btn" onclick="removeFromCart(${index})" style="color: #ff3b30; margin-left: auto;"><i data-feather="trash-2"></i></button>
                `;
                container.appendChild(div);
            });
            feather.replace();
        }

        function changeQty(index, delta) {
            const item = cart[index];
            if (delta > 0 && item.qty >= item.stock) { tg.showAlert("Больше нет в наличии"); return; }
            item.qty += delta;
            if (item.qty <= 0) cart.splice(index, 1);
            renderCart();
            updateCartBadge();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
            updateCartBadge();
            if (tg) tg.HapticFeedback.impactOccurred('medium');
        }

        async function checkout() {
            if (cart.length === 0) return;
            const noSizeItems = cart.filter(i => i.sizes && i.sizes.length > 0 && !i.size);
            if (noSizeItems.length > 0) { tg.showAlert("Пожалуйста, выберите размер для всех товаров!"); return; }
            const currency = document.getElementById('order-currency').value;
            const city = document.getElementById('order-city').value;
            const address = document.getElementById('order-address').value.trim();
            const phone = document.getElementById('order-phone').value.trim();
            if (!address || !phone) { tg.showAlert("Заполните адрес и телефон!"); return; }
            
            let totalSum = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            if (appliedPromo) totalSum = Math.round(totalSum * (1 - appliedPromo.discount / 100));

            try {
                cart.forEach(cartItem => {
                    const prodInCat = catalog[cartItem.catId].find(p => p.id === cartItem.id);
                    if (prodInCat) prodInCat.stock -= cartItem.qty;
                });

                // Списание использования промокода
                if (appliedPromo) {
                    const promoInDb = catalog.promocodes.find(p => p.code === appliedPromo.code);
                    if (promoInDb) promoInDb.uses -= 1;
                }

                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                    body: JSON.stringify(catalog)
                });
            } catch(e) { console.error("Ошибка склада", e); }

            // Сохранение заказа в localStorage
            let myOrders = JSON.parse(localStorage.getItem('blvck_orders')) || [];
            const newOrder = { date: new Date().toLocaleString(), items: [...cart], total: totalSum, currency: currency, city: city, address: address };
            myOrders.unshift(newOrder);
            localStorage.setItem('blvck_orders', JSON.stringify(myOrders));

            const orderData = {
                items: cart, total: totalSum, currency: currency, city: city, address: address, phone: phone
            };
            if (tg) { tg.sendData(JSON.stringify(orderData)); tg.close(); }
        }

        function showMyOrders() {
            switchTab('my-orders');
            const list = document.getElementById('orders-list');
            const myOrders = JSON.parse(localStorage.getItem('blvck_orders')) || [];
            if (myOrders.length === 0) {
                list.innerHTML = `<div class="empty-state"><i data-feather="box"></i><br>У вас пока нет заказов</div>`;
            } else {
                list.innerHTML = '';
                myOrders.forEach(order => {
                    const div = document.createElement('div');
                    div.className = 'order-card';
                    const symbol = CURRENCY_SYMBOLS[order.currency] || '₸';
                    let itemsText = order.items.map(i => `${i.name} (${i.qty} шт.)`).join(', ');
                    div.innerHTML = `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; color: #8e8e93; font-size: 12px;">
                            <span>${order.date}</span>
                            <span>${order.total.toLocaleString()} ${symbol}</span>
                        </div>
                        <div style="font-size: 14px; margin-bottom: 5px;">${itemsText}</div>
                        <div style="font-size: 12px; color: #8e8e93;">${order.city}, ${order.address}</div>
                    `;
                    list.appendChild(div);
                });
            }
            feather.replace();
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`page-${tabId}`).classList.add('active');
            if (element) element.classList.add('active');
            if (tabId === 'catalog') renderCatalog();
            if (tabId === 'favorites') renderFavorites();
            feather.replace();
        }

        loadData();
    </script>
</body>
</html>
