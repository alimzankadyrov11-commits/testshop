<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TestShop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --ios-blue: #007aff; --glass-bg: rgba(255, 255, 255, 0.65); --glass-border: rgba(255, 255, 255, 0.8); --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1); }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); color: #1d1d1f; overflow-x: hidden; padding-bottom: 80px; }
        .glass { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.9), inset 0 -1px 2px rgba(0, 0, 0, 0.05), var(--glass-shadow); border-radius: 24px; }
        .page { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .header { display: flex; align-items: center; margin-bottom: 20px; margin-top: 10px; }
        .back-btn { background: none; border: none; color: var(--ios-blue); font-size: 17px; font-weight: 500; padding: 0; margin-right: 15px; cursor: pointer; display: none; }
        h1 { font-weight: 700; font-size: 32px; letter-spacing: -0.5px; margin: 0; }
        .category-list { display: flex; flex-direction: column; gap: 12px; }
        .category-item { padding: 20px; font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; cursor: pointer; transition: transform 0.2s; }
        .category-item:active { transform: scale(0.97); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; display: none; }
        .product-card { padding: 12px; text-align: center; transition: transform 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card:active { transform: scale(0.97); }
        .product-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 16px; margin-bottom: 10px; background: #fff; }
        .product-card h3 { font-size: 14px; margin: 5px 0; font-weight: 600; line-height: 1.2; }
        .product-card .price { font-weight: 600; color: var(--ios-blue); font-size: 16px; margin-bottom: 12px; }
        .buy-btn { width: 100%; padding: 10px; border-radius: 12px; background: var(--ios-blue); color: white; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .buy-btn:active { opacity: 0.7; }
        .tab-bar { position: fixed; bottom: 15px; left: 15px; right: 15px; height: 65px; display: flex; justify-content: space-around; align-items: center; border-radius: 35px; z-index: 1000; }
        .tab-item { display: flex; flex-direction: column; align-items: center; color: #8e8e93; font-size: 10px; font-weight: 500; cursor: pointer; transition: color 0.2s; }
        .tab-item.active { color: var(--ios-blue); }
        .tab-icon { font-size: 24px; margin-bottom: 2px; }
        #map { height: 50vh; width: 100%; border-radius: 20px; margin-top: 15px; border: 1px solid var(--glass-border); z-index: 1; }
        .delivery-info { padding: 20px; margin-top: 15px; text-align: center; }
        .delivery-price { font-size: 24px; font-weight: 700; color: var(--ios-blue); margin-top: 10px; }
    </style>
</head>
<body>

    <div id="page-catalog" class="page active">
        <div class="header">
            <button class="back-btn" id="back-btn" onclick="goBack()">‹ Назад</button>
            <h1 class="apple-title" id="page-title">Каталог</h1>
        </div>
        <div id="category-screen" class="category-list"></div>
        <div id="products-grid" class="grid"></div>
    </div>

    <div id="page-delivery" class="page">
        <h1 class="apple-title">Доставка</h1>
        <p style="color:#666; font-size:14px; margin-bottom: 10px;">Укажите точку на карте для расчета.</p>
        <div id="map"></div>
        <div class="glass delivery-info">
            <div style="font-size: 14px; color: #666;">Примерная стоимость доставки:</div>
            <div id="delivery-price" class="delivery-price">Выберите точку...</div>
        </div>
    </div>

    <div class="tab-bar glass">
        <div class="tab-item active" onclick="switchTab('catalog', this)">
            <span class="tab-icon">🛍</span> Каталог
        </div>
        <div class="tab-item" onclick="switchTab('delivery', this)">
            <span class="tab-icon">🚚</span> Доставка
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        // ТВОИ ДАННЫЕ ДЛЯ ПОДКЛЮЧЕНИЯ К БАЗЕ
        const BIN_ID = "6b03f367ac6210605a9d6544";
        const MASTER_KEY = "$2a$10$N4Bo3Ce.syteyZ3fcwyhMOLONFcaF6IszommguuY.EIpLqr4WUt3O"; 
        
        let catalog = {};
        const catTitles = { outerwear: "Верхняя одежда", tshirts: "Футболки и верх", pants: "Штаны", shoes: "Обувь", accessories: "Аксессуары" };

        const categoryScreen = document.getElementById('category-screen');
        const productsGrid = document.getElementById('products-grid');
        const pageTitle = document.getElementById('page-title');
        const backBtn = document.getElementById('back-btn');

        // ЗАГРУЗКА ТОВАРОВ ИЗ БАЗЫ
        async function loadCatalog() {
            try {
                // Мы используем Master Key для чтения, чтобы точно сработало
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                catalog = data.record;

                for (let key in catalog) {
                    if (catalog[key].length > 0) {
                        catalog[key].title = catTitles[key];
                    }
                }
                renderCategories();
            } catch (e) {
                console.error("Ошибка загрузки:", e);
                categoryScreen.innerHTML = "<p>Ошибка загрузки каталога.</p>";
            }
        }

        function renderCategories() {
            pageTitle.innerText = "Каталог";
            backBtn.style.display = "none";
            productsGrid.style.display = "none";
            categoryScreen.style.display = "flex";
            categoryScreen.innerHTML = "";

            for (const [catId, items] of Object.entries(catalog)) {
                // Показываем категорию, только если в ней есть товары
                if (items.length > 0) {
                    const div = document.createElement('div');
                    div.className = 'category-item glass';
                    div.innerHTML = `<span>${catTitles[catId]}</span><span style="color:#c7c7cc">›</span>`;
                    div.onclick = () => renderProducts(catId);
                    categoryScreen.appendChild(div);
                }
            }
        }

        function renderProducts(catId) {
            pageTitle.innerText = catTitles[catId];
            backBtn.style.display = "block";
            categoryScreen.style.display = "none";
            productsGrid.style.display = "grid";
            productsGrid.innerHTML = "";

            catalog[catId].forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card glass';
                card.innerHTML = `
                    <img src="${p.photo}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <div class="price">${p.price} ₽</div>
                    <button class="buy-btn" onclick="buy('${p.id}', '${p.name}', ${p.price})">Купить</button>
                `;
                productsGrid.appendChild(card);
            });
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }

        function goBack() {
            renderCategories();
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }

        function buy(id, name, price) {
            if (tg) tg.HapticFeedback.notificationOccurred('success');
            const orderData = { id: id, name: name, price: price };
            if (tg) { tg.sendData(JSON.stringify(orderData)); tg.close(); } 
            else { alert(`Куплено: ${name} за ${price} руб.`); }
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.getElementById(`page-${tabName}`).classList.add('active');
            if (tg) tg.HapticFeedback.selectionChanged();
            if (tabName === 'delivery' && map) setTimeout(() => { map.invalidateSize(); }, 100);
        }

        let map;
        const HQ_LAT = 43.238949; const HQ_LNG = 76.889709;
        const BASE_PRICE = 500; const PRICE_PER_KM = 15;

        function initMap() {
            map = L.map('map').setView([HQ_LAT, HQ_LNG], 5);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
            L.marker([HQ_LAT, HQ_LNG]).addTo(map).bindPopup("<b>Склад</b>").openPopup();

            map.on('click', function(e) {
                const start = L.latLng(HQ_LAT, HQ_LNG);
                const end = L.latLng(e.latlng.lat, e.latlng.lng);
                const distanceKm = start.distanceTo(end) / 1000;
                let price = Math.round(BASE_PRICE + (distanceKm * PRICE_PER_KM));
                document.getElementById('delivery-price').innerText = `${price} ₽`;
                if (tg) tg.HapticFeedback.impactOccurred('medium');
                L.popup().setLatLng(e.latlng).setContent(`Доставка:<br><b>${price} ₽</b>`).openOn(map);
            });
        }

        loadCatalog();
        setTimeout(initMap, 500); 
    </script>
</body>
</html>
