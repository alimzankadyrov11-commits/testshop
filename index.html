<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TestShop</title>
    <!-- Официальный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* СТИЛИ В СТИЛЕ APPLE */
        body {
            background-color: #f5f5f7; /* Светло-серый фон Apple */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #1d1d1f;
        }
        .apple-title {
            font-weight: 700;
            font-size: 32px;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }
        .product-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); /* Мягкая тень */
            text-align: center;
            transition: transform 0.2s;
        }
        .product-card:active {
            transform: scale(0.97);
        }
        .product-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 10px;
            background-color: #e5e5ea;
        }
        .product-card h3 { 
            font-size: 15px; 
            margin: 5px 0; 
            font-weight: 600;
        }
        .product-card .price { 
            font-weight: 600; 
            color: #007aff; 
            font-size: 16px;
            margin-bottom: 12px;
        }
        .buy-btn {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            background: #007aff;
            color: white;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .buy-btn:active {
            background: #005bb5;
        }
    </style>
</head>
<body>
    <h1 class="apple-title">TestShop</h1>
    <div id="products-grid" class="grid"></div>

    <script>
        // ЛОГИКА (JavaScript)
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        // Данные товаров
        const products = [
            { id: 'tshirt', name: 'Белая футболка', price: 1500, photo: 'https://files.catbox.moe/x0zqnv.webp' },
            { id: 'hoodie', name: 'Худи', price: 3500, photo: 'https://files.catbox.moe/m2uf82.webp' },
            { id: 'jeans', name: 'Джинсы', price: 4000, photo: 'https://files.catbox.moe/vgs7rt.webp' },
            { id: 'jacket', name: 'Куртка', price: 8000, photo: 'https://files.catbox.moe/gv29hb.jpg' }
        ];

        const grid = document.getElementById('products-grid');
        
        // Отрисовка карточек
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${p.photo}" alt="${p.name}">
                <h3>${p.name}</h3>
                <div class="price">${p.price} ₽</div>
                <button class="buy-btn" onclick="buy('${p.id}', '${p.name}', ${p.price})">Купить</button>
            `;
            grid.appendChild(card);
        });

        // Функция покупки
        function buy(id, name, price) {
            if (tg) tg.HapticFeedback.impactOccurred('light');
            
            // Данные, которые уйдут в бота
            const orderData = { id: id, name: name, price: price };
            
            if (tg) {
                tg.sendData(JSON.stringify(orderData)); 
                tg.close(); 
            } else {
                alert(`Вы купили ${name} за ${price} руб. (Это тест в браузере)`);
            }
        }
    </script>
</body>
</html>
